name: CI

# 每次 push 与 PR 都跑：vet + test + 四平台交叉编译（只编译不发布）
# 刻意不使用 uses: actions/*，改用 git 直接拉代码 —— 内网环境访问 github.com
# 拉 action 仓库会偶发 "unexpected EOF"，去掉这个外部依赖后 CI 稳定得多。
on:
  push:
    branches: ["**"] # 只跑分支；tag 推送交给 release.yml，避免同一提交编两遍
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0' # modernc.org/sqlite 为纯 Go 实现，可全平台静态交叉编译

jobs:
  check:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRV="${{ github.server_url }}"
          URL="http://oauth2:${TOKEN}@${SRV#http://}/${{ github.repository }}.git"
          git init -q .
          git remote add origin "$URL"
          git fetch -q --depth 1 origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: 环境
        run: |
          go version
          go env GOPROXY GOTOOLCHAIN

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: 本机构建
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -buildvcs=false -o /tmp/go-shell .
          ls -lh /tmp/go-shell

  build:
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, goarm: '',  asset: linux-amd64 }
          - { goos: linux,   goarch: arm64, goarm: '',  asset: linux-arm64 }
          - { goos: linux,   goarch: arm,   goarm: '7', asset: linux-armv7 }
          - { goos: windows, goarch: amd64, goarm: '',  asset: windows-amd64 }
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRV="${{ github.server_url }}"
          URL="http://oauth2:${TOKEN}@${SRV#http://}/${{ github.repository }}.git"
          git init -q .
          git remote add origin "$URL"
          git fetch -q --depth 1 origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD

      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          mkdir -p out
          go build -trimpath -ldflags "-s -w" -buildvcs=false -o "out/go-shell${ext}" .
          ls -lh "out/go-shell${ext}"
