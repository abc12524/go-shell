name: CI

# 每次 push 与 PR 都跑：vet + test + 四平台交叉编译（只编译不发布）
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CGO_ENABLED: '0' # modernc.org/sqlite 为纯 Go 实现，可全平台静态交叉编译

jobs:
  check:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          go version
          go env GOPROXY GOTOOLCHAIN

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: 本机构建
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -buildvcs=false -o /tmp/go-shell .
          /tmp/go-shell --help 2>&1 | head -5 || true

  build:
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, goarm: '',  asset: linux-amd64 }
          - { goos: linux,   goarch: arm64, goarm: '',  asset: linux-arm64 }
          - { goos: linux,   goarch: arm,   goarm: '7', asset: linux-armv7 }
          - { goos: windows, goarch: amd64, goarm: '',  asset: windows-amd64 }
    steps:
      - uses: actions/checkout@v4

      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          mkdir -p out
          go build -trimpath -ldflags "-s -w" -buildvcs=false -o "out/go-shell${ext}" .
          ls -lh "out/go-shell${ext}"
