name: Release (Gitea)

# Gitea 侧发布流程（GitHub 侧仍走 .github/workflows/release.yml）
# 两种触发方式：
#   1) 打 tag 推送 —— 自动编译四平台，并发布该 tag 对应的 Release
#        git tag v1.0.0 && git push origin v1.0.0
#   2) Actions → Release (Gitea) → Run workflow
#        version 留空 → 自动 vYYYY.MM.DD-<short-sha>；publish=true 才发布
# 日常 push 分支只跑 ci.yml，不会产生 Release。
# 不使用 uses: actions/*，checkout 直接用 git + GITHUB_TOKEN。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.2.0）；留空自动生成 vYYYY.MM.DD-<short-sha>'
        required: false
        default: ''
      publish:
        description: '编译完成后是否发布 Release'
        type: choice
        options: ['true', 'false']
        default: 'true'

permissions:
  contents: write

env:
  CGO_ENABLED: '0' # modernc.org/sqlite 是纯 Go 实现，可全平台静态交叉编译

jobs:
  release:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（完整历史，供生成 tag 用）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRV="${{ github.server_url }}"
          URL="http://oauth2:${TOKEN}@${SRV#http://}/${{ github.repository }}.git"
          git init -q .
          git remote add origin "$URL"
          git fetch -q origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: 编译 4 个平台并打包
        run: |
          set -euo pipefail
          mkdir -p pkg dist

          build() {
            local goos="$1" goarch="$2" goarm="$3" asset="$4"
            echo "── $asset (GOOS=$goos GOARCH=$goarch GOARM=${goarm:-})"
            rm -rf dist && mkdir -p dist
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
              go build -trimpath -ldflags "-s -w" -buildvcs=false -o "dist/go-shell${ext}" .
            cp README.md dist/
            if [ "$goos" = "windows" ]; then
              (cd dist && zip -9 -q "../pkg/${asset}.zip" ./*)
            else
              tar -czf "pkg/${asset}.tar.gz" -C dist .
            fi
          }

          build linux   amd64 ''  go-shell-linux-amd64
          build linux   arm64 ''  go-shell-linux-arm64
          build linux   arm   '7' go-shell-linux-armv7
          build windows amd64 ''  go-shell-windows-amd64

          (cd pkg && sha256sum ./* > checksums.txt && cat checksums.txt)

      - name: 发布 Release
        # tag 推送必然发布；手动触发时 publish=false 才会跳过（用 event.inputs 兼容无 input 的事件）
        if: github.event_name == 'push' || github.event.inputs.publish != 'false'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # tag 推送直接用 tag 名；手动触发按输入或日期生成
          case "$REF" in
            refs/tags/*)
              TAG="${REF#refs/tags/}"
              echo "触发方式：tag 推送（$TAG）"
              ;;
            *)
              TAG="${INPUT_VERSION#v}"
              if [ -z "$TAG" ]; then TAG="$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"; fi
              echo "触发方式：手动"
              ;;
          esac
          case "$TAG" in v*) ;; *) TAG="v${TAG}" ;; esac
          echo "tag: $TAG"

          # 同名 tag 的旧 release 先删掉，保证可重复发布
          EXISTING=$(curl -s -H "Authorization: token $TOKEN" "$API/tags/$TAG")
          if echo "$EXISTING" | grep -q '"id"'; then
            EID=$(echo "$EXISTING" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            echo "删除旧 release id=$EID"
            curl -s -X DELETE -H "Authorization: token $TOKEN" "$API/$EID" >/dev/null
          fi

          # body 里带 target_commitish，保证手动触发时 tag 落在本次编译的提交上
          cat > /tmp/rel.json <<EOF
          {"tag_name":"$TAG","name":"$TAG","body":"go-shell $TAG（commit $SHA）","prerelease":false,"target_commitish":"$SHA"}
          EOF

          REL=$(curl -s -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/rel.json "$API")
          RID=$(echo "$REL" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$RID" ]; then echo "创建 release 失败：$REL"; exit 1; fi
          echo "release id=$RID"

          for f in pkg/*; do
            name=$(basename "$f")
            echo "上传 $name"
            curl -s --fail -X POST -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$API/$RID/assets?name=$name" >/dev/null
          done
          echo "已发布 ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
